plugins { id 'com.android.application' }
android { namespace 'br.com.knightjoga'; compileSdk 36; ndkVersion '27.2.12479018'
 defaultConfig { applicationId 'app.luni.arena'; minSdk 26; targetSdk 36; versionCode 23; versionName '0.1.21'; ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { cppFlags '-O2 -std=c++17' } } }
 buildTypes {
  release {
   debuggable false
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
  }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
 implementation 'org.apache.commons:commons-compress:1.28.0'
 implementation 'org.tukaani:xz:1.12'
 implementation 'com.google.zxing:core:3.5.4'
 implementation 'com.google.mlkit:translate:17.0.3'
}
tasks.register('checkPreviewCores') {
 doLast {
  def libs = ['libbsnes_mercury_performance_libretro_android.so', 'libmesen_s_libretro_android.so']
  def missing = libs.findAll { !file("src/main/jniLibs/arm64-v8a/${it}").isFile() }
  if (!missing.isEmpty()) throw new GradleException(
    "Núcleos ausentes: ${missing.join(', ')}. Execute py -3 tools/fetch_core.py na raiz do projeto antes de compilar.")
 }
}
tasks.named('preBuild') { dependsOn tasks.named('checkPreviewCores') }

// Publishing a moving nightly by accident would leave no exact corresponding source.
tasks.register('verifyReleaseCores', Exec) {
 workingDir rootProject.projectDir
 commandLine(System.getProperty('os.name').toLowerCase().contains('win')
   ? ['py', '-3', 'tools/verify_release_cores.py']
   : ['python3', 'tools/verify_release_cores.py'])
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
 dependsOn tasks.named('verifyReleaseCores')
}
